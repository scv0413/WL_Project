[project]
name = "snatch-analysis"
version = "0.1.0"
description = "Coach-assisted analysis of side-view snatch videos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "torch",
    "torchvision",
    "ultralytics",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
